name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # the latest patch of go.mod's Go: the standard library's fixes
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: the workflows parse (actionlint; a broken one is skipped without a word)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
      - name: go test
        run: go test -race ./...
      - name: the test vectors are what the code makes
        run: go test ./internal/vectors
      - name: known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: conformance test (pure-Python Ed25519)
        run: |
          pip install pytest
          go build -o "$RUNNER_TEMP/opence-master" ./cmd/opence-master
          OPENCE_MASTER_BIN="$RUNNER_TEMP/opence-master" python -m pytest -q tests/conformance
      - name: conformance test (the cryptography package)
        run: |
          pip install cryptography
          OPENCE_MASTER_BIN="$RUNNER_TEMP/opence-master" python -m pytest -q tests/conformance

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["linux/amd64", "linux/arm64", "linux/arm/7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # the latest patch of go.mod's Go: the standard library's fixes
          go-version: "1.26.x"
          check-latest: true
      - name: static binary
        run: |
          IFS=/ read -r os arch arm <<< "${{ matrix.target }}"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=${arm#v} go build -trimpath -ldflags "-s -w" -o opence-master ./cmd/opence-master
          file opence-master

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the image
        run: docker build --build-arg "VERSION=${GITHUB_SHA::12}" -t opence-master:ci .
      - name: smoke test the image
        run: |
          docker run --rm opence-master:ci version
          # (bad usage exits 2)
          status=0
          docker run --rm opence-master:ci no-such-command || status=$?
          test "$status" -eq 2
          # a first start with no settings: it makes its key and prints the setup link
          id=$(docker run -d opence-master:ci)
          sleep 3
          docker exec "$id" /usr/local/bin/opence-master health
          docker logs "$id" 2>&1 | grep -q "made the master key"
          docker logs "$id" 2>&1 | grep -q "/admin/setup?code="
          test "$(docker inspect -f '{{.Config.User}}' opence-master:ci)" = "65532:65532"
          docker rm -f "$id"
