name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: the test vectors are what the code makes
        run: go test ./internal/vectors
      - name: known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: conformance test (pure-Python Ed25519)
        run: |
          pip install pytest
          go build -o "$RUNNER_TEMP/opence-master" ./cmd/opence-master
          OPENCE_MASTER_BIN="$RUNNER_TEMP/opence-master" python -m pytest -q tests/conformance
      - name: conformance test (the cryptography package)
        run: |
          pip install cryptography
          OPENCE_MASTER_BIN="$RUNNER_TEMP/opence-master" python -m pytest -q tests/conformance

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ["linux/amd64", "linux/arm64", "linux/arm/7"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: static binary
        run: |
          IFS=/ read -r os arch arm <<< "${{ matrix.target }}"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=${arm#v} go build -trimpath -ldflags "-s -w" -o opence-master ./cmd/opence-master
          file opence-master

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: build the image
        run: docker build --build-arg VERSION=${GITHUB_SHA::12} -t opence-master:ci .
      - name: smoke test the image
        run: |
          docker run --rm opence-master:ci version
          docker run --rm opence-master:ci serve && exit 1 || test $? -eq 2
          id=$(docker run -d -e MASTER_NAME=CI -e MASTER_CONTACT=ci@example.org \
            -e MASTER_KEY=4ccd089b28ff96da9db6c346ec114e0f5b8a319f35aba624da8cf6ed4fb8a6fb opence-master:ci)
          sleep 3
          docker exec "$id" /usr/local/bin/opence-master health
          test "$(docker inspect -f '{{.Config.User}}' opence-master:ci)" = "65532:65532"
          docker rm -f "$id"
