# The master behind Caddy, which gets the certificate and terminates TLS.
# install.sh (README.md, "Installing") sets it up in /opt/opence-master;
# by hand:
#
#   echo MASTER_DOMAIN=master1.example.org > .env
#   echo MASTER_PUBLIC_URL=https://master1.example.org > master.env
#   docker compose up -d
#   docker compose logs master    # the setup link: open it to name the master
#
# The master makes its key at its first start (back up the master-data
# volume), and updates itself: the admin pages, or the bot's notice in the
# applications channel; docker compose pull && docker compose up -d works
# too. To run an image built from this checkout instead:
# docker build -t ghcr.io/opencommunityedition/opence-master-server:latest .
#
# The master believes X-Forwarded-For and X-Forwarded-Proto only from the
# compose network's addresses (MASTER_TRUSTED_PROXIES), where Caddy is.
services:
  master:
    image: ghcr.io/opencommunityedition/opence-master-server:latest
    restart: unless-stopped
    env_file: master.env
    environment:
      MASTER_TRUSTED_PROXIES: 172.30.90.0/24
    volumes:
      - master-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [master]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      MASTER_DOMAIN: ${MASTER_DOMAIN:?set MASTER_DOMAIN to the master's domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [master]
    networks: [master]

networks:
  master:
    ipam:
      config:
        - subnet: 172.30.90.0/24

volumes:
  master-data:
  caddy-data:
  caddy-config:
