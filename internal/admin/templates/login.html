{{define "content"}}
<form class="stack panel" method="post" action="/admin/login">
<label for="token">Admin token</label>
<input type="password" id="token" name="token" required autocomplete="current-password">
<p class="hint">The token the setup showed, or MASTER_ADMIN_TOKEN when that is set.</p>
<button type="submit">Log in</button>
</form>
{{end}}
